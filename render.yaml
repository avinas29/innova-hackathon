# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New → Blueprint" and select the repository. Render reads this file.
#
# One web service. The Dockerfile builds the Next.js UI to static files and
# bundles them into the FastAPI image, so a single container serves the UI and
# the API on one port — one URL, no CORS, and nothing to configure between them.

services:
  - type: web
    name: veritas
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      # ── Model provider ───────────────────────────────────────────────────
      # Set this in the Render dashboard, not here. `sync: false` marks it as
      # a secret Render prompts for on first deploy and never stores in git.
      # Groq first — measured at ~4x Gemini's free daily requests and ~4x
      # faster per call. `sync: false` makes Render prompt for the value and
      # keeps it out of git.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: VERITAS_LLM_PROVIDER
        value: auto
      # Split roles across providers to use two free-tier quotas at once.
      # Set both to swap which model does what without touching code; leave
      # blank to run everything on one provider.
      - key: VERITAS_PROVIDER_FAST
        sync: false
      - key: VERITAS_PROVIDER_STRONG
        sync: false
      # The free plan has limited CPU and the free Gemini tier limited quota;
      # this profile keeps a run inside both.
      - key: VERITAS_PROFILE
        value: free
      - key: VERITAS_MODEL_FAST_GEMINI
        value: gemini-3.1-flash-lite
      - key: VERITAS_MODEL_STRONG_GEMINI
        value: gemini-3.5-flash

      # ── Search ───────────────────────────────────────────────────────────
      # Wired automatically to the searxng service defined below. Render
      # substitutes that service's hostname; the client adds the https scheme.
      - key: SEARXNG_URL
        fromService:
          name: veritas-searxng
          type: web
          property: host
      - key: TAVILY_API_KEY
        sync: false
      # DuckDuckGo blocks datacenter IP ranges, so it fails from any PaaS —
      # SearXNG (below) is what actually works in deployment. DDG stays last as
      # a no-op safety net.
      - key: VERITAS_SEARCH_ORDER
        value: searxng,tavily,brave,duckduckgo

      # ── Runtime ──────────────────────────────────────────────────────────
      - key: VERITAS_LOG_JSON
        value: "true"
      # On the free plan the filesystem is ephemeral and is wiped on every
      # restart, so runs do not persist. Attach a disk (paid) or move to
      # Postgres if history matters.
      - key: VERITAS_DB_PATH
        value: /tmp/veritas.db
      # Free instances sleep after inactivity and cold-start slowly; a longer
      # wall-clock ceiling stops a run being killed mid-flight.
      - key: VERITAS_MAX_WALL_SECONDS
        value: "1500"

  # ── Search backend ────────────────────────────────────────────────────────
  # Self-hosted metasearch. Needed because DuckDuckGo blocks datacenter IPs,
  # so the keyless fallback that works locally fails from any PaaS.
  #
  # No API key and no per-query cost, which suits a system that issues dozens
  # of queries per run — every hosted search API would either bill or throttle
  # that volume.
  - type: web
    name: veritas-searxng
    runtime: docker
    dockerfilePath: ./searxng/Dockerfile
    dockerContext: ./searxng
    plan: free
    region: oregon
    healthCheckPath: /healthz

    envVars:
      # SearXNG refuses to start without a secret; Render generates one and
      # keeps it out of git.
      - key: SEARXNG_SECRET
        generateValue: true
      - key: INSTANCE_NAME
        value: veritas-search
      # Render injects PORT at runtime; the entrypoint maps it onto GRANIAN_PORT,
      # which is what the image actually reads.
