[project]
name = "veritas"
version = "1.0.0"
description = "Autonomous multi-agent research and fact-verification system with calibrated per-claim confidence"
# No `readme` field: the project README lives at the repo root, and setuptools
# rejects paths outside the package directory.
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "langgraph>=0.2.60",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "tenacity>=9.0.0",
    "trafilatura>=1.12.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
openai = ["openai>=1.55.0"]
anthropic = ["anthropic>=0.40.0"]
# Gemini speaks the OpenAI wire format at its compatibility endpoint, so it
# needs the OpenAI SDK rather than a Google-specific one.
gemini = ["openai>=1.55.0"]
# Optional local cross-encoder entailment backend (MiniCheck / HHEM style).
# Not installed by default: adds ~2GB of torch wheels.
local-nli = ["torch>=2.4.0", "transformers>=4.45.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
veritas = "veritas.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["veritas*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
