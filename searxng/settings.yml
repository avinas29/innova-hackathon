# SearXNG configuration for VERITAS.
#
# The one line that actually matters is `formats: [json]` — SearXNG serves HTML
# only by default and answers API requests with HTTP 403. Without it the
# provider is skipped and you get no search results, with no obvious cause.

use_default_settings: true

server:
  # Local-only instance; replace if you expose it beyond localhost.
  secret_key: "veritas-local-dev-change-me"
  limiter: false          # no bot-detection rate limiting for local use
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  # REQUIRED. Enables the JSON API that VERITAS calls.
  formats:
    - html
    - json

engines:
  # Engines that reliably return substantive snippets for fact-checking.
  # Snippet quality matters more than result count here: the entailment scorer
  # reads the snippet when a full page fetch fails.
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: arxiv
    disabled: false
  - name: semantic scholar
    disabled: false
  - name: pubmed
    disabled: false
  # Image, video and social engines add noise without adding evidence.
  - name: youtube
    disabled: true
  - name: reddit
    disabled: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
