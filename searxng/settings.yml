# SearXNG configuration for VERITAS.
#
# The line that actually matters is `formats: [json]`. SearXNG serves HTML only
# by default and answers API requests with HTTP 403 — the single most common
# reason a self-hosted instance works in a browser but not from code.

use_default_settings: true

server:
  # Injected by the entrypoint; Render generates it, local runs get a random one.
  secret_key: "ultrasecretkey"
  # Bot-detection rate limiting would throttle our own agent: a single run
  # issues dozens of queries in seconds from one IP.
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  # REQUIRED — enables the JSON API that VERITAS calls.
  formats:
    - html
    - json

# Snippet quality matters more than result count: when a full page fetch fails,
# the entailment scorer reads the search snippet instead. Image, video and
# social engines add noise without adding evidence.
engines:
  - name: wikipedia
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: arxiv
    disabled: false
  - name: semantic scholar
    disabled: false
  - name: pubmed
    disabled: false
  - name: crossref
    disabled: false
  - name: youtube
    disabled: true
  - name: reddit
    disabled: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
