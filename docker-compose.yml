name: veritas

services:
  # One image, one port, UI and API together — the same artefact that gets
  # deployed to Render, so local behaviour matches production.
  veritas:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Read from a .env file beside this compose file, or the host shell.
      # Absent keys fall back to the deterministic offline provider so the
      # stack always starts.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VERITAS_LLM_PROVIDER: ${VERITAS_LLM_PROVIDER:-auto}
      VERITAS_PROFILE: ${VERITAS_PROFILE:-free}
      VERITAS_MODEL_FAST_GEMINI: ${VERITAS_MODEL_FAST_GEMINI:-gemini-3.1-flash-lite}
      VERITAS_MODEL_STRONG_GEMINI: ${VERITAS_MODEL_STRONG_GEMINI:-gemini-3.5-flash}

      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      # Service name, not localhost: inside a container localhost is the
      # container itself, so a host-style URL silently returns no results.
      SEARXNG_URL: ${SEARXNG_URL_INTERNAL:-http://searxng:8080}
      VERITAS_SEARCH_ORDER: ${VERITAS_SEARCH_ORDER:-searxng,tavily,exa,brave,duckduckgo}

      VERITAS_DB_PATH: /data/veritas.db
      VERITAS_LOG_JSON: "true"
      PORT: "8000"
    volumes:
      - veritas-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Self-hosted metasearch. Opt-in:
  #   docker compose --profile searxng up -d
  #
  # No API key, no quota, no rate limiting, and it aggregates many engines —
  # which suits a system that issues dozens of queries per run and gets
  # throttled by every hosted alternative.
  searxng:
    image: searxng/searxng:latest
    profiles: ["searxng"]
    ports:
      - "8080:8080"
    environment:
      BASE_URL: http://localhost:8080/
      INSTANCE_NAME: veritas-search
    volumes:
      - ./searxng:/etc/searxng:rw
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    restart: unless-stopped

volumes:
  veritas-data:
